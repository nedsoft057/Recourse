[package]
name = "recourse"
version = "0.1.0"
edition = "2021"
description = "Recourse: buyer protection for stablecoin payments, held in transferable receipt NFTs"
license = "MIT"
repository = "https://github.com/nedsoft057/recourse"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"
near-contract-standards = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
