name: Film the live site
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated clip names to film (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - run: cp scripts/film.mjs /tmp/pw/ && cd /tmp/pw && node film.mjs
        env:
          ONLY: ${{ inputs.only }}
      - name: Push clips to the film branch
        if: always()
        run: |
          cd /tmp/pw/film
          git init -q -b film && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch -q origin film && git reset -q --soft origin/film || true
          git add -A && git commit -qm "Film clips $(date -u +%H:%M)" && git push -q origin film
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film
          path: /tmp/pw/film/
