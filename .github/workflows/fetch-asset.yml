name: Fetch asset
# Downloads an image listed in .github/smoke/asset ("<url> <path>") and commits it.
on:
  push:
    paths: [".github/smoke/asset"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read URL DEST; do
            [ -z "$URL" ] && continue
            mkdir -p "$(dirname "$DEST")"
            curl -sSfL "$URL" -o "$DEST"
            ls -la "$DEST"
          done < .github/smoke/asset
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/public
          git commit -m "Add generated assets"
          git push
