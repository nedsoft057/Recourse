name: Fetch asset
# Downloads an image listed in .github/smoke/asset ("<url> <path>") and commits it.
on:
  push:
    paths: [".github/smoke/asset"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          read URL DEST < .github/smoke/asset
          curl -sSfL "$URL" -o "$DEST"
          file "$DEST"; ls -la "$DEST"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add $DEST"
          git push
