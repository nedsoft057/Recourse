name: Probe explorers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p /tmp/pw/probe && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/.github/probe/probe.mjs . && node probe.mjs
          cd probe && git init -q -b probe && git config user.name github-actions && git config user.email a@b.c
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add -A && git commit -qm probe && git push -qf origin probe
