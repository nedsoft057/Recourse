name: NEAR AI Cloud models
on:
  push:
    paths: [".github/smoke/models"]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://cloud-api.near.ai/v1/model/list | jq -r '.. | objects | select(has("modelId") or has("model_id") or has("id")) | (.modelId // .model_id // .id)' | sort -u | head -60
