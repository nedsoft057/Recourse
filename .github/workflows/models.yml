name: List AI models
on:
  push:
    paths: [".github/smoke/models"]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - name: list
        run: |
          curl -s https://cloud-api.near.ai/v1/models > m.json
          jq -r '.data[]?.id' m.json
          echo ----
          head -c 8000 m.json
